<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Command Production Planner v1.1</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}header{background:#172b43;color:#fff;padding:20px}main{padding:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;padding:12px;border-radius:8px}.card .v{font-size:24px;font-weight:bold}table{width:100%;border-collapse:collapse;background:#fff;margin-top:15px}th,td{border:1px solid #ddd;padding:6px}input,select{width:100%;box-sizing:border-box}.summary{background:#fff;padding:15px;margin-top:15px;border-radius:8px}button{padding:8px 12px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style></head><body><header><h1>Material Command Production Planner v1.1</h1></header><main>
<div class='cards'>
<div class='card'><div>Components</div><div id='c1' class='v'>0</div></div>
<div class='card'><div>Quantity</div><div id='c2' class='v'>0</div></div>
<div class='card'><div>Area m²</div><div id='c3' class='v'>0</div></div>
<div class='card'><div>Sheets</div><div id='c4' class='v'>0</div></div>
<div class='card'><div>Edge m</div><div id='c5' class='v'>0</div></div></div>
<p><button onclick='addRow()'>+ Add Component</button></p>
<table><thead><tr><th>#</th><th>Component</th><th>L cm</th><th>H cm</th><th>Qty</th><th>Thickness</th><th>Wood</th><th>Edge</th><th>Same</th><th>Grain</th><th>Sheet</th><th>Edges</th><th>Area</th><th>Edge m</th><th>Warn</th></tr></thead><tbody id='tbody'></tbody></table>
<div class='summary'><h3>Material Summary</h3><div id='summary'></div></div>
<script>
const colors=['White','Oak','Walnut','Grey','Black','Beige','Cashmere','Anthracite']; let n=0;
function opts(a){return a.map(x=>`<option>${x}</option>`).join('')}
function addRow(){n++; let tr=document.createElement('tr'); tr.innerHTML=`<td>${n}</td><td><select><option>Shelf</option><option>Partition</option><option>Door</option></select></td><td><input class=l value=60 type=number></td><td><input class=h value=280 type=number></td><td><input class=q value=1 type=number></td><td><select class=t><option selected>22 mm</option><option>18 mm</option><option>16 mm</option><option>8 mm</option></select></td><td><select class=w>${opts(colors)}</select></td><td><select class=e>${opts(colors)}</select></td><td><input class=same type=checkbox checked></td><td><select class=g><option selected>Grained</option><option>Plain</option></select></td><td><input class=sheet value='207x280'></td><td>T<input class=ed type=checkbox checked> B<input class=ed type=checkbox checked> L<input class=ed type=checkbox> R<input class=ed type=checkbox></td><td class=a>0</td><td class=m>0</td><td class=warn></td>`; tbody.appendChild(tr); let w=tr.querySelector('.w'),e=tr.querySelector('.e'),s=tr.querySelector('.same'); e.value=w.value; e.disabled=true; w.onchange=()=>{if(s.checked)e.value=w.value; calc()}; s.onchange=()=>{e.disabled=s.checked; if(s.checked)e.value=w.value; calc()}; tr.oninput=calc; tr.onchange=calc; calc();}
function calc(){let rows=[...document.querySelectorAll('#tbody tr')]; let qty=0,edge=0,areaT=0,sheetsT=0,sum={}; rows.forEach(r=>{let l=+r.querySelector('.l').value||0,h=+r.querySelector('.h').value||0,q=+r.querySelector('.q').value||0;color=r.querySelector('.w').value;th=r.querySelector('.t').value;grain=r.querySelector('.g').value; let area=(l*h*q)/10000; r.querySelector('.a').innerText=area.toFixed(2); areaT+=area; let ed=r.querySelectorAll('.ed'); let cm=0;if(ed[0].checked)cm+=l;if(ed[1].checked)cm+=l;if(ed[2].checked)cm+=h;if(ed[3].checked)cm+=h; let m=(cm/100)*q; r.querySelector('.m').innerText=m.toFixed(2); edge+=m; qty+=q; r.querySelector('.warn').innerText=(l>206||h>279)?'Oversize':''; let sheetArea=(206*279)/10000; let sheets=(area*1.15)/sheetArea; let key=color+' | '+th+' | '+grain; if(!sum[key])sum[key]={area:0,edge:0}; sum[key].area+=area; sum[key].edge+=m; sheetsT+=sheets;}); c1.innerText=rows.length;c2.innerText=qty;c3.innerText=areaT.toFixed(2); c4.innerText=Math.ceil(sheetsT); c5.innerText=edge.toFixed(2); let html=''; Object.entries(sum).forEach(([k,v])=>{let sheets=Math.ceil((v.area*1.15)/((206*279)/10000)); html+=`<p><b>${k}</b><br>Area: ${v.area.toFixed(2)} m² | Sheets: ${sheets} | Edge: ${v.edge.toFixed(2)} m</p>`}); summary.innerHTML=html||'No data';}
window.onload=()=>{addRow();addRow();addRow();}
</script></main></body></html>

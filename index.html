<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Command Production Planner v1.1</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #172b43;
      background: #f3f6fa;
      --navy: #172b43;
      --blue: #2563eb;
      --line: #dfe6ef;
      --muted: #65758b;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }

    header {
      padding: 20px clamp(16px, 4vw, 40px);
      background: var(--navy);
      color: #fff;
    }

    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); }

    main {
      max-width: 1600px;
      margin: auto;
      padding: 22px clamp(12px, 3vw, 30px) 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .card,
    .summary {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 2px 8px #172b4308;
    }

    .card { min-height: 77px; padding: 13px 15px; }
    .card-label { color: var(--muted); font-size: 13px; }

    .card .v {
      display: block;
      margin-top: 5px;
      font-size: 23px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 10px;
    }

    .toolbar h2,
    .summary h2 {
      margin: 0;
      font-size: 17px;
    }

    .hint {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      padding: 9px 13px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font: 600 14px Arial, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 1240px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    th,
    td {
      padding: 4px 5px;
      border: 1px solid var(--line);
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #f4f7fb;
      color: #52647a;
      font-size: 10px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) { background: #fbfcfe; }

    input:not([type="checkbox"]),
    select {
      width: 100%;
      height: 27px;
      padding: 0 5px;
      border: 1px solid #d4dce7;
      border-radius: 4px;
      background: #fff;
      color: #172b43;
      font: inherit;
    }

    input[type="number"] {
      min-width: 0;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--blue);
      vertical-align: middle;
    }

    .edge-options {
      display: grid;
      grid-template-columns: repeat(2, auto);
      justify-content: center;
      column-gap: 8px;
      row-gap: 0;
    }

    .edge-options label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: #52647a;
      font-size: 10px;
      line-height: 13px;
    }

    .same-cell {
      display: flex;
      justify-content: center;
    }

    .result {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }

    .warning {
      color: #b45309;
      font-weight: 700;
      white-space: nowrap;
    }

    th:nth-child(1), td:nth-child(1) { width: 34px; }
    th:nth-child(2), td:nth-child(2) { width: 100px; }
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) { width: 70px; }
    th:nth-child(5), td:nth-child(5) { width: 48px; }
    th:nth-child(6), td:nth-child(6) { width: 82px; }
    th:nth-child(7), td:nth-child(7),
    th:nth-child(8), td:nth-child(8) { width: 88px; }
    th:nth-child(9), td:nth-child(9) { width: 48px; }
    th:nth-child(10), td:nth-child(10) { width: 75px; }
    th:nth-child(11), td:nth-child(11) { width: 84px; }
    th:nth-child(12), td:nth-child(12) { width: 62px; }
    th:nth-child(13), td:nth-child(13),
    th:nth-child(14), td:nth-child(14) { width: 68px; }
    th:nth-child(15), td:nth-child(15) { width: 72px; }

    .summary {
      margin-top: 16px;
      padding: 16px;
    }

    .summary-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .summary-item {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfe;
    }

    .summary-item h3 {
      margin: 0 0 7px;
      font-size: 13px;
    }

    .summary-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      color: #52647a;
      font-size: 12px;
    }

    .summary-stats b { color: #172b43; }
    .empty { color: var(--muted); font-size: 13px; }

    @media (max-width: 850px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      main { padding: 16px 10px 28px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .card { padding: 11px; }
      .card .v { font-size: 21px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar button { width: 100%; }
      .summary { padding: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Material Command Production Planner v1.1</h1>
  </header>

  <main>
    <section class="cards" aria-label="Production totals">
      <div class="card"><span class="card-label">Components</span><strong id="c1" class="v">0</strong></div>
      <div class="card"><span class="card-label">Quantity</span><strong id="c2" class="v">0</strong></div>
      <div class="card"><span class="card-label">Area m²</span><strong id="c3" class="v">0.00</strong></div>
      <div class="card"><span class="card-label">Sheets</span><strong id="c4" class="v">0</strong></div>
      <div class="card"><span class="card-label">Edge m</span><strong id="c5" class="v">0.00</strong></div>
    </section>

    <div class="toolbar">
      <div>
        <h2>Components</h2>
        <p class="hint">Dimensions are in centimetres. Scroll horizontally to view all columns.</p>
      </div>
      <button type="button" id="add-button">+ Add Component</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Component</th><th>L cm</th><th>H cm</th>
            <th>Qty</th><th>Thickness</th><th>Wood</th><th>Edge</th>
            <th>Same</th><th>Grain</th><th>Sheet</th><th>Edges</th>
            <th>Area</th><th>Edge m</th><th>Warn</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <section class="summary">
      <h2>Material Summary</h2>
      <div id="summary" class="summary-list"></div>
    </section>
  </main>

  <script>
    const colors = [
      "White", "Oak", "Walnut", "Grey",
      "Black", "Beige", "Cashmere", "Anthracite"
    ];

    const tbody = document.querySelector("#tbody");
    const summary = document.querySelector("#summary");
    let rowNumber = 0;

    function options(items) {
      return items.map(item => `<option>${item}</option>`).join("");
    }

    function addRow() {
      rowNumber++;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${rowNumber}</td>
        <td>
          <select aria-label="Component">
            <option>Shelf</option>
            <option>Partition</option>
            <option>Door</option>
          </select>
        </td>
        <td><input class="l" aria-label="Length in centimetres" value="60" type="number" min="0" step="any"></td>
        <td><input class="h" aria-label="Height in centimetres" value="280" type="number" min="0" step="any"></td>
        <td><input class="q" aria-label="Quantity" value="1" type="number" min="0" step="1"></td>
        <td>
          <select class="t" aria-label="Thickness">
            <option selected>22 mm</option>
            <option>18 mm</option>
            <option>16 mm</option>
            <option>8 mm</option>
          </select>
        </td>
        <td><select class="w" aria-label="Wood color">${options(colors)}</select></td>
        <td><select class="e" aria-label="Edge color">${options(colors)}</select></td>
        <td>
          <div class="same-cell">
            <input class="same" aria-label="Use same edge color" type="checkbox" checked>
          </div>
        </td>
        <td>
          <select class="g" aria-label="Grain">
            <option selected>Grained</option>
            <option>Plain</option>
          </select>
        </td>
        <td><input class="sheet" aria-label="Sheet size" value="207x280"></td>
        <td>
          <div class="edge-options">
            <label>T<input class="ed" type="checkbox" checked aria-label="Top edge"></label>
            <label>B<input class="ed" type="checkbox" checked aria-label="Bottom edge"></label>
            <label>L<input class="ed" type="checkbox" aria-label="Left edge"></label>
            <label>R<input class="ed" type="checkbox" aria-label="Right edge"></label>
          </div>
        </td>
        <td class="a result">0.00</td>
        <td class="m result">0.00</td>
        <td class="warn warning"></td>
      `;

      tbody.appendChild(row);

      const wood = row.querySelector(".w");
      const edge = row.querySelector(".e");
      const same = row.querySelector(".same");

      edge.value = wood.value;
      edge.disabled = true;

      wood.addEventListener("change", () => {
        if (same.checked) edge.value = wood.value;
        calculate();
      });

      same.addEventListener("change", () => {
        edge.disabled = same.checked;
        if (same.checked) edge.value = wood.value;
        calculate();
      });

      row.addEventListener("input", calculate);
      row.addEventListener("change", calculate);
      calculate();
    }

    function calculate() {
      const rows = [...tbody.querySelectorAll("tr")];
      let totalQuantity = 0;
      let totalEdge = 0;
      let totalArea = 0;
      let totalSheets = 0;
      const groups = {};

      rows.forEach(row => {
        const length = Number(row.querySelector(".l").value) || 0;
        const height = Number(row.querySelector(".h").value) || 0;
        const quantity = Number(row.querySelector(".q").value) || 0;
        const color = row.querySelector(".w").value;
        const thickness = row.querySelector(".t").value;
        const grain = row.querySelector(".g").value;

        const area = length * height * quantity / 10000;
        row.querySelector(".a").textContent = area.toFixed(2);
        totalArea += area;

        const edgeChecks = row.querySelectorAll(".ed");
        let edgeCm = 0;
        if (edgeChecks[0].checked) edgeCm += length;
        if (edgeChecks[1].checked) edgeCm += length;
        if (edgeChecks[2].checked) edgeCm += height;
        if (edgeChecks[3].checked) edgeCm += height;

        const edgeMetres = edgeCm * quantity / 100;
        row.querySelector(".m").textContent = edgeMetres.toFixed(2);
        totalEdge += edgeMetres;
        totalQuantity += quantity;

        const oversize = length > 206 || height > 279;
        row.querySelector(".warn").textContent = oversize ? "Oversize" : "";
        row.querySelector(".warn").title = oversize
          ? "Part exceeds the usable 206 × 279 cm sheet size"
          : "";

        const sheetArea = 206 * 279 / 10000;
        totalSheets += area * 1.15 / sheetArea;

        const key = `${color} | ${thickness} | ${grain}`;
        if (!groups[key]) groups[key] = { area: 0, edge: 0 };
        groups[key].area += area;
        groups[key].edge += edgeMetres;
      });

      document.querySelector("#c1").textContent = rows.length;
      document.querySelector("#c2").textContent = totalQuantity;
      document.querySelector("#c3").textContent = totalArea.toFixed(2);
      document.querySelector("#c4").textContent = Math.ceil(totalSheets);
      document.querySelector("#c5").textContent = totalEdge.toFixed(2);

      summary.replaceChildren();

      if (!Object.keys(groups).length) {
        summary.innerHTML = '<p class="empty">No components yet.</p>';
        return;
      }

      Object.entries(groups).forEach(([key, value]) => {
        const item = document.createElement("article");
        item.className = "summary-item";

        const title = document.createElement("h3");
        title.textContent = key;

        const stats = document.createElement("div");
        stats.className = "summary-stats";
        stats.innerHTML = `
          <span>Area <b>${value.area.toFixed(2)} m²</b></span>
          <span>Sheets <b>${Math.ceil(value.area * 1.15 / (206 * 279 / 10000))}</b></span>
          <span>Edge <b>${value.edge.toFixed(2)} m</b></span>
        `;

        item.append(title, stats);
        summary.append(item);
      });
    }

    document.querySelector("#add-button").addEventListener("click", addRow);

    // Add five rows after the page has loaded.
    window.addEventListener("load", () => {
      for (let i = 0; i < 5; i++) addRow();
    });
  </script>
</body>
</html>
